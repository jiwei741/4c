[project]
name = "spatio-eco-inference"
version = "0.1.0"
description = "Algorithm workspace for Spatio-Eco member A"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cdsapi>=0.7.7",
    "imagecodecs>=2024.0.0",
    "netcdf4>=1.7.2",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "tifffile>=2025.0.0",
    "torch>=2.5",
    "xarray>=2025.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
