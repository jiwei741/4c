study_area:
  name: nanjing

grid:
  path: ../../data/processed/features/nanjing/grid_nodes.csv
  node_id_column: node_id
  lat_column: latitude
  lon_column: longitude

sources:
  sentinel2:
    path_candidates:
      - ../../data/processed/features/nanjing/sentinel2_features_from_sam2.csv
      - ../../data/processed/features/nanjing/sentinel2_features.csv
    timestamp_column: timestamp
    node_id_column: node_id
    feature_columns:
      - vegetation_area_ratio
      - ndvi_mean
  era5:
    path: ../../data/processed/features/nanjing/era5_features.csv
    timestamp_column: timestamp
    node_id_column: node_id
    feature_columns:
      - land_surface_temperature
      - u10_wind
      - v10_wind
      - precipitation
  edgar:
    path: ../../data/processed/features/nanjing/edgar_features.csv
    timestamp_column: timestamp
    node_id_column: node_id
    feature_columns:
      - edgar_emission

labels:
  path: ../../data/processed/features/nanjing/labels.csv
  timestamp_column: timestamp
  node_id_column: node_id
  target_column: net_carbon_flux

adjacency:
  method: radius
  radius_km: 8.0
  symmetric: true

options:
  timestamps: intersection
  missing_value_strategy: error

output:
  path: ../../data/processed/inference/nanjing_training_v1.npz
  metadata_path: ../../data/processed/inference/nanjing_training_v1.meta.json
