study_area: nanjing
start_date: 2020-01-01
end_date: 2024-12-31
sources:
  - name: sentinel2_l2a
    source_type: satellite
    cadence: 5-day
    raw_dir: data/raw/sentinel2/nanjing
    output_format: SAFE
  - name: era5_land_monthly
    source_type: climate
    cadence: monthly
    raw_dir: data/raw/era5/nanjing
    output_format: netcdf
  - name: edgar_co2
    source_type: emission_inventory
    cadence: yearly
    raw_dir: data/raw/edgar/nanjing
    output_format: geotiff
  - name: mod17a2hgf_gpp
    source_type: carbon_label
    cadence: 8-day
    raw_dir: data/raw/gpp/nanjing
    output_format: geotiff
