services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: spatio-eco-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spatio_eco}
      POSTGRES_USER: ${POSTGRES_USER:-spatio_eco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spatio_eco_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
